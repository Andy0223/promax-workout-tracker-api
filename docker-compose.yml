services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: promax-workout-postgres
    environment:
      POSTGRES_DB: workout_tracker_db
      POSTGRES_USER: workout_user
      POSTGRES_PASSWORD: workout_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - workout-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U workout_user -d workout_tracker_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: promax-workout-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - workout-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
  # Spring Boot application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promax-workout-api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workout_tracker_db
      SPRING_DATASOURCE_USERNAME: workout_user
      SPRING_DATASOURCE_PASSWORD: workout_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workout-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  workout-network:
    driver: bridge
